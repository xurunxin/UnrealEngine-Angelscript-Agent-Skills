name: Validate Agent Kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install optional development dependencies
        shell: bash
        run: |
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Validate package structure and links
        run: python tools/validate_kit.py .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python tools
        run: python -m py_compile tools/*.py tests/*.py
