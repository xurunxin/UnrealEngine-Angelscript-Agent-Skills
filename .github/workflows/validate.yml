name: Validate Agent Skills

on:
  push:
    branches:
      - main
      - "upgrade/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Agent Skills frontmatter and links
        run: python scripts/validate_skills.py

      - name: Validate package structure and compatibility fixtures
        run: python tools/validate_kit.py .

      - name: Validate routing and behavior eval fixtures
        run: python scripts/validate_evals.py

      - name: Validate source-reference format
        run: python scripts/check_source_refs.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python tools
        run: python -m compileall -q scripts tools tests
